<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roseberry Ops</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#131211">
<link rel="apple-touch-icon" href="./icon-192.png">

<!-- The design's three faces. Loaded from Google Fonts because there is no
     build step here to self-host them; every rule below carries a real
     fallback stack so a blocked or slow font never leaves the app unreadable. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">

<script>
  // Applied before first paint so a dark-default app never flashes linen.
  // Dark is the default here — unlike the dashboard — because the phone gets
  // used outdoors and at 5am. The toggle lives in More.
  (function () {
    try {
      var t = localStorage.getItem('ops-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode */ }
  })();
</script>

<style>
  /* ═══════════════════════════════════════════════════════════════════════
     v2 "high-contrast editorial" — the dashboard's design system.
     Token values are copied verbatim from apps/web/tailwind.config.ts and
     globals.css so the phone and the dashboard are demonstrably the same
     product. Dark is :root (the phone's default); light is opt-in.
     ═══════════════════════════════════════════════════════════════════════ */

  :root {
    color-scheme: dark;

    /* Deepened to a near-black ground (the dashboard's dark is a lighter,
       browner brown). The warmth is dialled right back — just enough that the
       rust accent still belongs — so this reads as proper dark rather than
       dark-brown. Layer separation is preserved: bg->surface contrast is
       1.076:1, matching the original 1.077:1. */
    --bg: #131211;
    --surface: #1b1a18;
    --surface-2: #232220;
    --surface-3: #2b2a27;

    /* Warmed a shade against the deeper ground. All of these clear WCAG AA on
       both --bg and --surface; ink-3 is the floor for TEXT at 5.26:1. ink-4 is
       non-text only — empty checkbox borders, disabled glyphs, hairlines. */
    --ink: #f2efe9;
    --ink-2: #c4beb2;
    --ink-3: #8e877b;
    --ink-4: #58524a;

    --line: rgba(243, 239, 231, 0.1);
    --line-strong: rgba(243, 239, 231, 0.18);
    --line-strongest: rgba(243, 239, 231, 0.34);

    --accent: #e0623f;
    --accent-soft: rgba(224, 98, 63, 0.14);
    --accent-line: rgba(224, 98, 63, 0.36);

    --warn: #d9a544;
    --warn-soft: rgba(217, 165, 68, 0.14);
    --warn-line: rgba(217, 165, 68, 0.32);

    --good: #6fae8c;
    --good-soft: rgba(111, 174, 140, 0.14);
    --good-line: rgba(111, 174, 140, 0.3);

    --prio3: #7fa3d1;

    --hover-wash: rgba(243, 239, 231, 0.04);
    --active-wash: rgba(243, 239, 231, 0.07);
    --selection: rgba(224, 98, 63, 0.3);

    --nav-h: 60px;
  }

  :root[data-theme='light'] {
    color-scheme: light;

    /* Canvas is warm linen, and raised surfaces go LIGHTER than the canvas so
       they still read as surfaces; recessed fills stay darker. */
    --bg: #f6f2ea;
    --surface: #fcfaf5;
    --surface-2: #efe9dd;
    --surface-3: #e6dfd0;

    --ink: #12100e;
    --ink-2: #57524a;
    --ink-3: #8b847a;
    --ink-4: #b6afa4;

    --line: rgba(18, 16, 14, 0.09);
    --line-strong: rgba(18, 16, 14, 0.17);
    --line-strongest: rgba(18, 16, 14, 0.34);

    --accent: #b8442b;
    --accent-soft: rgba(184, 68, 43, 0.09);
    --accent-line: rgba(184, 68, 43, 0.3);

    --warn: #96650f;
    --warn-soft: rgba(150, 101, 15, 0.1);
    --warn-line: rgba(150, 101, 15, 0.28);

    --good: #3b6a52;
    --good-soft: rgba(59, 106, 82, 0.1);
    --good-line: rgba(59, 106, 82, 0.26);

    --prio3: #3f5f86;

    --hover-wash: rgba(18, 16, 14, 0.035);
    --active-wash: rgba(18, 16, 14, 0.06);
    --selection: rgba(184, 68, 43, 0.22);
  }

  /* ── Type ────────────────────────────────────────────────────────────── */
  /* serif = Newsreader (display), sans = Geist (body), mono = Geist Mono
     (eyebrows, meta, pills). Everything small and uppercase is mono; that
     contrast is the design's signature. */
  :root {
    --serif: 'Newsreader', ui-serif, Georgia, serif;
    --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    /* Kill horizontal scroll: a stray wide child must never let the page
       slide sideways. `clip`, not `hidden`, so sticky headers keep working. */
    overflow-x: clip;
  }

  body {
    margin: 0;
    padding: 0 0 calc(var(--nav-h) + env(safe-area-inset-bottom));
    font: 400 16px/1.5 var(--sans);
  }

  ::selection { background: var(--selection); }

  /* ── Editorial primitives ────────────────────────────────────────────── */

  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .hairline { height: 1px; width: 100%; background: var(--line); }
  .hairline-strong { height: 1px; width: 100%; background: var(--line-strong); }

  /* Screen header: mono eyebrow over a Newsreader display title. Reused on
     every screen — it is what makes this read as the same app. */
  .screen-head { padding: 32px 20px 20px; }
  .screen-head .eyebrow { margin-bottom: 8px; }
  .screen-head h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 28px;
    line-height: 1.05;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: var(--ink);
    text-transform: none;
  }
  .screen-head .meta {
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.4;
    color: var(--ink-3);
  }
  .screen-head .row-actions { display: flex; align-items: flex-end; gap: 10px; }
  .screen-head .row-actions > div:first-child { flex: 1; min-width: 0; }

  /* Section label: eyebrow on a rule, the divider between list blocks. */
  .section-label {
    display: flex; align-items: center; gap: 10px;
    padding: 24px 20px 8px;
  }
  .section-label .eyebrow { flex: 1; min-width: 0; }

  .screen { padding-bottom: 24px; }

  /* ── Surfaces ────────────────────────────────────────────────────────── */
  /* The dashboard is hairline-and-whitespace, not boxes-in-boxes: lists sit
     directly on the canvas divided by rules. A `.panel` is used only where
     something genuinely needs lifting off the page (forms, sign-in). */

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 16px;
    margin: 0 20px 16px;
  }

  .list { border-top: 1px solid var(--line); }

  .item {
    display: block; width: 100%; text-align: left;
    background: none; border: none;
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    color: var(--ink); font: inherit; cursor: pointer;
    transition: background 0.12s;
  }
  .item:active { background: var(--active-wash); }
  @media (hover: hover) { .item:hover { background: var(--hover-wash); } }

  .item-title {
    font-family: var(--sans); font-size: 15px; line-height: 1.4;
    /* Two lines then ellipsis: a long quote shouldn't own the list. */
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .item-title.serif {
    font-family: var(--serif); font-size: 17px; font-weight: 400;
    letter-spacing: -0.01em;
  }

  /* Meta is mono, uppercase, letter-spaced — the counterweight to the serif. */
  .item-meta {
    margin-top: 4px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px;
    font-family: var(--mono); font-size: 10px; font-weight: 400;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);
  }
  .item-meta.plain { text-transform: none; letter-spacing: 0.02em; font-size: 11px; }

  /* Row with its own control (checkbox) beside a tappable body. */
  .row-item { display: flex; align-items: flex-start; gap: 12px; cursor: default; }
  .item-body {
    flex: 1; min-width: 0; background: none; border: none;
    text-align: left; padding: 0; color: inherit; font: inherit; cursor: pointer;
  }
  .item-body.static { cursor: default; }

  /* ── Anchor line ─────────────────────────────────────────────────────── */
  /* One sentence of orientation under the masthead — what's on, what's set,
     what's waiting. Serif, because it reads as a sentence, not as chrome. */
  .anchor {
    margin: 0; padding: 0 20px 4px;
    font-family: var(--serif); font-size: 17px; line-height: 1.5;
    color: var(--ink-2);
  }
  .anchor b { font-weight: 500; color: var(--ink); }
  .anchor b.over { color: var(--accent); }
  .anchor .dim { color: var(--ink-3); }
  .linkish {
    background: none; border: none; padding: 0; cursor: pointer;
    font: inherit; color: var(--ink-2);
    text-decoration: underline; text-underline-offset: 3px;
    text-decoration-color: var(--line-strong);
  }
  .linkish:hover { color: var(--accent); }

  /* ── Brief lines ─────────────────────────────────────────────────────── */
  /* A newspaper column: big metric, small unit, then the fact and the one
     action it offers. Facts only — the tone rule is no advice. */
  .brief { border-top: 1px solid var(--line); }
  .brief-line {
    display: flex; align-items: flex-start; gap: 16px;
    width: 100%; text-align: left; cursor: pointer;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 16px 20px; color: var(--ink); font: inherit;
    transition: background 0.12s;
  }
  .brief-line:active { background: var(--active-wash); }
  @media (hover: hover) { .brief-line:hover { background: var(--hover-wash); } }

  .brief-metric {
    flex: 0 0 74px; display: flex; flex-direction: column; align-items: flex-start;
  }
  .brief-metric .big {
    font-family: var(--serif); font-size: 34px; line-height: 1;
    font-weight: 500; letter-spacing: -0.02em; color: var(--ink-3);
  }
  .brief-line.slip .brief-metric .big { color: var(--accent); }
  .brief-line.stale .brief-metric .big { color: var(--warn); }
  .brief-metric .unit {
    margin-top: 5px;
    font-family: var(--mono); font-size: 9px; line-height: 1.3;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);
  }

  .brief-body { flex: 1; min-width: 0; }
  .brief-name {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: var(--serif); font-size: 17px; letter-spacing: -0.01em;
  }
  .brief-next {
    margin-top: 8px; display: flex; align-items: center; gap: 6px;
    font-family: var(--sans); font-size: 13px; color: var(--ink-2);
  }
  .brief-next .arrow { color: var(--ink-3); }

  /* ── Top 3 star ──────────────────────────────────────────────────────── */
  .star {
    flex: 0 0 auto; background: none; border: none; cursor: pointer;
    padding: 0 0 0 8px; font-size: 16px; line-height: 1;
    color: var(--ink-4); font-family: var(--sans);
  }
  .star.on { color: var(--accent); }
  .row-item.pinned { background: var(--accent-soft); }

  /* ── Library quote ───────────────────────────────────────────────────── */
  .quote-text {
    font-family: var(--serif); font-size: 19px; line-height: 1.45;
    letter-spacing: -0.01em; color: var(--ink);
  }
  .item.quote .item-meta { margin-top: 8px; }

  /* ── Checkbox ────────────────────────────────────────────────────────── */
  /* 20px, square, hairline border — deliberately not a rounded green tick.
     Done fills with ink-2 and shows a canvas-coloured check. */
  .tick {
    flex: 0 0 auto; width: 20px; height: 20px; margin-top: 2px;
    display: grid; place-items: center;
    border: 1px solid var(--line-strong); border-radius: 0;
    background: transparent; cursor: pointer; padding: 0;
    transition: border-color 0.12s, background 0.12s;
  }
  .tick svg { width: 12px; height: 12px; display: none; }
  .tick.on { background: var(--ink-2); border-color: var(--ink-2); }
  .tick.on svg { display: block; stroke: var(--bg); }
  /* Waiting reads as provisional, so the box is dashed rather than solid. */
  .tick.waiting { border-style: dashed; border-color: var(--ink-3); }
  .tick.dismiss { border: none; color: var(--ink-3); font-size: 16px; line-height: 1; }

  /* ── Pills ───────────────────────────────────────────────────────────── */
  /* The one place the palette leaves monochrome: four states, each a colour
     plus soft fill and border, with a leading dot echoing the state. */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    height: 20px; padding: 0 8px; border-radius: 999px;
    border: 1px solid transparent;
    font-family: var(--mono); font-size: 9.5px; font-weight: 600;
    line-height: 1; letter-spacing: 0.07em; text-transform: uppercase;
    white-space: nowrap;
  }
  .pill .dot { width: 5px; height: 5px; border-radius: 999px; background: currentColor; flex: 0 0 auto; }
  .pill.over  { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
  .pill.due   { color: var(--warn);   background: var(--warn-soft);   border-color: var(--warn-line); }
  .pill.ok    { color: var(--good);   background: var(--good-soft);   border-color: var(--good-line); }
  .pill.quiet { color: var(--ink-3);  background: transparent;        border-color: var(--line-strong); }
  .pill.solid { color: var(--bg);     background: var(--accent);      border-color: var(--accent); }
  .pill.plain { color: var(--ink-2);  background: var(--surface-2);   border-color: transparent; }

  /* ── The Briefing (Today) ───────────────────────────────────────────── */
  /* Ported from the dashboard's /today page.tsx + brief-line.tsx: masthead
     pill row, a two-column ledger + sticky ambient rail on desktop
     (stacked on the phone), and the editorial brief-line cards with their
     three-segment cadence bar. */

  .briefing-head .row-actions { align-items: flex-end; }
  .briefing-pills { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 2px; }

  .briefing-focus { padding: 12px 20px 0; font-family: var(--sans); font-size: 14px; color: var(--ink); }
  .briefing-focus .eyebrow { color: var(--ink-3); }
  .briefing-focus .dim { color: var(--ink-3); }

  .briefing-anchor { margin: 10px 20px 0; font-family: var(--sans); font-size: 12px; line-height: 1.5; color: var(--ink-2); }
  .briefing-anchor .over { color: var(--accent); }

  .briefing-inbox {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    width: calc(100% - 40px); margin: 18px 20px 0; padding: 10px 0 10px 12px;
    border-left: 2px solid var(--accent); background: none; border-top: none; border-right: none; border-bottom: none;
    cursor: pointer; text-align: left;
  }
  .briefing-inbox:hover { background: rgba(224,98,63,0.04); }

  .briefing-grid { margin-top: 22px; }
  .briefing-left { min-width: 0; }
  .briefing-right { margin-top: 28px; }

  .briefing-section { padding: 0 20px; margin-top: 30px; }
  .briefing-section:first-child { margin-top: 0; }
  .briefing-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .briefing-empty { font-family: var(--serif); font-size: 14px; font-style: italic; line-height: 1.5; color: var(--ink-2); margin: 0; }

  .brief-card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    border: 1px solid var(--line); border-radius: 5px; background: var(--bg);
    padding: 14px; color: inherit; font: inherit;
    transition: border-color 0.12s;
  }
  .brief-card:hover { border-color: var(--line-strong); }

  .cadence-bar { position: relative; height: 3px; background: var(--line-strong); margin-top: 2px; }
  .cadence-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--ink-3); }
  .cadence-over { position: absolute; top: 0; height: 100%; background: var(--accent); }
  .cadence-tick { position: absolute; top: -2px; height: 7px; width: 1px; background: var(--ink-2); }

  .urgency-dot { width: 8px; height: 8px; border-radius: 999px; flex: 0 0 auto; margin-top: 6px; background: var(--ink-3); }
  .urgency-dot.high { background: var(--accent); }
  .urgency-dot.normal { background: var(--ink-2); }

  .briefing-reflection, .briefing-quote {
    margin: 30px 20px 0; padding: 20px; background: var(--surface);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .briefing-quote { background: none; border: 1px solid var(--line); border-radius: 0; }

  .briefing-event { display: flex; align-items: baseline; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }

  .item-title.done { color: var(--ink-3); text-decoration: line-through; }

  .briefing-capture { padding: 0 20px; margin-top: 30px; }
  .capture-chip {
    flex: 0 0 auto; height: 30px; padding: 0 12px; border-radius: 5px;
    border: 1px solid var(--line); background: none; color: var(--ink-2); cursor: pointer;
    font-family: var(--sans); font-size: 12px; font-weight: 500;
  }
  .capture-chip:hover { color: var(--ink); border-color: var(--line-strong); }

  @media (min-width: 800px) {
    .briefing-focus, .briefing-anchor, .briefing-section, .briefing-capture { padding-inline: 0; }
    .briefing-inbox { width: 100%; margin-inline: 0; }
    .briefing-reflection, .briefing-quote { margin-inline: 0; }
    .briefing-grid { display: grid; grid-template-columns: minmax(0,1fr) 348px; gap: 0 40px; align-items: start; }
    .briefing-right { margin-top: 0; position: sticky; top: 76px; }
  }

  /* ── Detail shell ────────────────────────────────────────────────────── */
  /* Ported from components/detail/DetailShell.tsx: header band → stat strip
     → two-column read layout. Shared by Content, People and Companies
     detail screens. */
  .dim { color: var(--ink-3); }
  .mono-10 { font-family: var(--mono); font-size: 10px; }
  .over { color: var(--accent); }

  .detail-header { background: var(--surface); border-bottom: 1px solid var(--line-strong); padding: 20px 20px 18px; }
  .detail-crumb {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3);
  }
  .detail-crumb button.linkish { font: inherit; text-transform: inherit; letter-spacing: inherit; text-decoration: none; }
  .detail-title-row { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
  .detail-title {
    margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0;
    font-family: var(--serif); font-size: 28px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; color: var(--ink);
  }
  .detail-title-dot { width: 11px; height: 11px; border-radius: 999px; flex: 0 0 auto; }
  .detail-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .detail-below { margin-top: 10px; }

  .detail-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 5px;
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em;
    cursor: pointer; border: 1px solid transparent;
  }
  .detail-btn.ghost { background: var(--bg); border-color: var(--line-strong); color: var(--ink-2); }
  .detail-btn.ghost:hover { border-color: var(--ink-3); color: var(--ink); }
  .detail-btn.solid { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .detail-btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }

  .stat-strip { display: grid; grid-template-columns: repeat(2, 1fr); border-bottom: 1px solid var(--line-strong); }
  .stat-tile { padding: 14px 20px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
  .stat-tile:nth-child(2n) { border-right: none; }
  .stat-label { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .stat-tile.tone-accent .stat-label { color: var(--accent); }
  .stat-tile.tone-warn .stat-label { color: var(--warn); }
  .stat-value { font-family: var(--serif); font-size: 24px; line-height: 1; letter-spacing: -0.01em; color: var(--ink); display: flex; align-items: baseline; gap: 5px; }
  .stat-tile.tone-accent .stat-value { color: var(--accent); }
  .stat-tile.tone-warn .stat-value { color: var(--warn); }
  .stat-unit { font-family: var(--sans); font-size: 12px; font-weight: 400; color: var(--ink-3); }
  .stat-sub { margin-top: 5px; font-family: var(--mono); font-size: 10px; color: var(--ink-4); }
  .stat-tile.tone-accent .stat-sub { color: var(--accent); }
  .stat-count { display: flex; align-items: baseline; gap: 4px; margin-right: 12px; }
  .stat-count b { font-family: var(--serif); font-size: 22px; font-weight: 500; }
  .stat-count b.dim { color: var(--ink-4); }
  .stat-count-label { font-family: var(--mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-4); }

  .detail-body { display: block; }
  .detail-main { padding: 20px; min-width: 0; }
  .detail-rail { padding: 20px; border-top: 1px solid var(--line); background: var(--surface); }
  .detail-section { margin-top: 26px; }
  .detail-section:first-child { margin-top: 0; }
  .detail-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }

  .rail-block { margin-top: 22px; }
  .rail-block:first-child { margin-top: 0; }
  .rail-block-label { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3); padding-bottom: 7px; border-bottom: 1px solid var(--line); margin-bottom: 9px; }
  .kv-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 5px 0; }
  .kv-key { font-family: var(--mono); font-size: 10px; text-transform: uppercase; color: var(--ink-3); flex: 0 0 auto; }
  .kv-val { font-family: var(--sans); font-size: 13.5px; color: var(--ink); text-align: right; min-width: 0; }
  .kv-val a { color: inherit; }

  .conv-list { border-top: 1px solid var(--line); }
  .conv-row { padding: 12px 0; border-bottom: 1px solid var(--line); }

  /* Card grid (People / Companies list). */
  .card-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .entity-card { display: block; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); padding: 15px 16px 13px; cursor: pointer; text-align: left; transition: border-color 0.12s; }
  .entity-card:hover { border-color: var(--line-strong); }

  @media (min-width: 800px) {
    .detail-header, .detail-main, .detail-rail { padding-inline: 0; }
    .detail-body { display: grid; grid-template-columns: minmax(0,1fr) 320px; align-items: start; gap: 0 40px; }
    .detail-rail { border-top: none; border-left: 1px solid var(--line); background: none; padding-left: 24px; }
    .detail-title { font-size: 36px; }
  }

  /* ── Work pulse board ───────────────────────────────────────────────── */
  /* Ported from the dashboard's /work screen: domain sections carry a
     colour swatch, project cards carry a colour bar + progress, content
     rows carry a colour dot — this is the one screen that leaves the
     otherwise-monochrome design, matching the dashboard exactly. */

  /* ── Facet rail ─────────────────────────────────────────────────────── */
  /* A port of FacetRail.tsx: the one filtering pattern for every list screen.
     Desktop: a sticky left sidebar. Phone: a floating pill that opens the
     same groups in the shared bottom sheet — see lib/sheet via app.js. */
  .work-layout { display: block; }
  .work-body { padding-bottom: 24px; }
  .facet-rail { display: none; }
  .filters-fab {
    position: fixed; left: 16px; z-index: 35;
    bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
    height: 42px; padding: 0 16px; border-radius: 999px;
    background: var(--ink); color: var(--bg); border: none; cursor: pointer;
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    box-shadow: 0 4px 16px rgba(0,0,0,0.28);
  }
  .facet-group { padding: 0 20px 20px; }
  .facet-group-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
  .facet-row {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 7px 8px; margin: 0 -8px 2px; border-radius: 5px; border: none;
    background: none; cursor: pointer; text-align: left;
    font-family: var(--sans); font-size: 13px; color: var(--ink-2);
  }
  .facet-row:hover { background: var(--hover-wash); color: var(--ink); }
  .facet-row.on { background: var(--ink); color: var(--bg); }
  .facet-swatch { width: 9px; height: 9px; border-radius: 2.5px; flex: 0 0 auto; }
  .facet-row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facet-row-count { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); }
  .facet-row.on .facet-row-count { color: rgba(255,255,255,0.6); }
  .facet-tags { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 20px 20px; margin-top: -20px; }
  .facet-tag {
    padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line-strong);
    background: none; color: var(--ink-2); cursor: pointer;
    font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  }
  .facet-tag.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .facet-sep { height: 1px; margin: 0 20px 20px; background: var(--line); }

  @media (min-width: 800px) {
    .work-layout { display: flex; align-items: flex-start; }
    .facet-rail {
      display: block; width: 228px; flex: 0 0 auto; align-self: flex-start;
      position: sticky; top: 60px; max-height: calc(100dvh - 60px); overflow-y: auto;
      border-right: 1px solid var(--line); background: var(--surface);
      padding: 20px 0; margin-right: 32px;
    }
    .facet-rail .facet-group, .facet-rail .facet-sep, .facet-rail .facet-tags { padding-inline: 20px; }
    .facet-rail .facet-tags { margin-top: -20px; }
    .filters-fab { display: none; }
    .work-body { flex: 1; min-width: 0; }
  }

  .work-head-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .work-cta {
    height: 34px; padding: 0 12px; border-radius: 5px; cursor: pointer;
    background: var(--ink); color: var(--bg); border: 1px solid var(--ink);
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.09em; text-transform: uppercase;
  }
  .ghost.small { height: 34px; }

  .work-focus {
    margin: 4px 20px 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .work-focus-line {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    font-family: var(--sans); font-size: 14px; color: var(--ink);
  }
  .work-focus-line .eyebrow { flex: 0 0 auto; }
  .work-focus-line .linkish { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; text-decoration: none; }

  .work-domain { border-top: 1px solid var(--line); padding: 16px 20px 20px; }
  .work-domain:last-child { border-bottom: 1px solid var(--line); }

  .work-domain-head {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 0; margin: -8px 0 8px;
    background: var(--bg); border-bottom: 2px solid var(--ink);
  }
  .work-swatch {
    width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto;
  }
  .work-swatch.small { width: 9px; height: 9px; border-radius: 2.5px; }
  .work-swatch.ring { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
  .work-domain-name {
    background: none; border: none; padding: 0; cursor: pointer; text-align: left;
    font-family: var(--serif); font-size: 19px; font-weight: 500;
    letter-spacing: -0.015em; color: var(--ink);
  }
  .work-domain-counts {
    margin-left: auto; display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--ink-3);
    white-space: nowrap;
  }
  .work-domain-counts .over { color: var(--accent); }
  .work-collapse {
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 5px;
    background: none; border: none; color: var(--ink-3); cursor: pointer; font-size: 13px;
  }

  .work-project-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px; margin-bottom: 12px;
  }
  .work-project-card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
    overflow: hidden; padding: 0; color: inherit; font: inherit;
    transition: border-color 0.12s;
  }
  .work-project-card:hover, .work-project-card:active { border-color: var(--line-strong); }
  .work-project-card.flagged { border-color: rgba(224, 98, 63, 0.5); }
  .work-project-card.paused { opacity: 0.6; }
  .work-project-bar { height: 3px; }
  .work-project-body { padding: 12px 13px; }
  .work-project-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px;
  }
  .work-project-name {
    display: inline-flex; align-items: baseline; gap: 6px; min-width: 0;
    font-family: var(--serif); font-size: 16px; font-weight: 500;
    letter-spacing: -0.01em; color: var(--ink);
  }
  .work-flag-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); flex: 0 0 auto; }
  .work-project-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }

  .work-content-list { border: 1px solid var(--line); border-radius: 5px; margin-bottom: 12px; overflow: hidden; }
  .work-content-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .work-content-row:last-child { border-bottom: none; }
  .work-content-main { flex: 1; min-width: 0; background: none; border: none; padding: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; }
  .work-content-title { font-family: var(--sans); font-size: 14px; color: var(--ink); }

  .work-links { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .work-links .ghost.small { width: auto; margin: 0; }
  .work-links .linkish {
    font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.09em; text-decoration: none;
  }
  .work-links .linkish:hover { color: var(--accent); }

  .work-parked { margin-top: 16px; padding: 0 20px; }

  .work-empty { padding: 48px 20px; text-align: center; }
  .work-empty-title { font-family: var(--serif); font-size: 22px; font-weight: 500; letter-spacing: -0.015em; color: var(--ink); }

  .progress-bar { height: 4px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 4px 0; }
  .progress-fill { height: 100%; }

  @media (min-width: 800px) {
    .work-focus, .work-parked { padding-inline: 0; margin-inline: 0; }
    .work-domain-head { top: 0; }
    .work-project-grid { grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); }
  }

  /* ── Library ─────────────────────────────────────────────────────────── */
  /* Ported from library-view.tsx: a masonry feed of notes/quotes/journal
     entries plus a book-cover shelf. Shares .work-layout/.work-body/
     .facet-rail with Content/People/Companies — only the card shapes below
     are Library's own. Reader pages (note/quote/journal/book detail) use
     .lib-reader instead of the operational .detail-* shell, since they're a
     different job: a centered serif read, not a stat-strip dashboard. */

  .lib-masonry { display: flex; align-items: flex-start; gap: 14px; }
  .lib-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

  .lib-card { border: 1px solid var(--line); border-radius: 5px; background: var(--bg); overflow: hidden; transition: border-color 0.12s; }
  .lib-card:hover { border-color: var(--line-strong); }
  .lib-card-image-btn { display: block; width: 100%; padding: 0; border: none; background: none; cursor: pointer; }
  .lib-card-image { display: block; width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid var(--line); }
  .lib-card-body { padding: 15px 16px 13px; }
  .lib-card-kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .lib-card-kicker-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); }
  .lib-card-photo-count, .lib-card-date { flex: 0 0 auto; font-family: var(--mono); font-size: 10px; color: var(--ink-4); }
  .lib-card-link { display: block; width: 100%; padding: 0; border: none; background: none; text-align: left; cursor: pointer; color: inherit; }
  .lib-card-quote { font-family: var(--serif); font-size: 16px; font-style: italic; line-height: 1.45; color: var(--ink); }
  .lib-card-book { margin-top: 10px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-card-title { margin-bottom: 6px; font-family: var(--serif); font-size: 15px; font-weight: 500; line-height: 1.25; color: var(--ink); }
  .lib-card-text { margin: 0; font-family: var(--sans); font-size: 13px; line-height: 1.5; color: var(--ink-2); white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }

  .lib-tagrow { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  .lib-tag { padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line-strong); background: none; color: var(--ink-2); font-family: var(--mono); font-size: 10px; font-weight: 500; cursor: pointer; }
  .lib-tag.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .lib-tag-warn { color: var(--warn); border-color: var(--warn-line); cursor: default; }

  .lib-book-grid { display: grid; gap: 18px 14px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .lib-book-card { display: block; width: 100%; padding: 0; border: none; background: none; text-align: left; cursor: pointer; color: inherit; }
  .lib-book-cover { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 3px; margin-bottom: 8px; border: 1px solid var(--line-strong); }
  .lib-book-cover-tint { display: flex; align-items: flex-start; padding: 12px; font-family: var(--serif); font-size: 13px; font-weight: 500; line-height: 1.25; }
  .lib-book-title { font-family: var(--sans); font-size: 12.5px; font-weight: 500; line-height: 1.3; color: var(--ink); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .lib-book-author { margin-top: 3px; font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-book-foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .lib-book-meta { font-family: var(--mono); font-size: 9.5px; color: var(--ink-4); }

  .lib-reader { max-width: 640px; margin: 0 auto; padding: 16px 20px 88px; }
  .lib-reader.wide { max-width: 760px; }
  .lib-crumb { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
  .lib-crumb button.linkish { text-decoration: none; }
  .lib-reader-eyebrow { margin-top: 10px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.11em; color: var(--ink-3); }
  .lib-reader-title { margin: 8px 0 0; font-family: var(--serif); font-size: 27px; font-weight: 500; line-height: 1.1; letter-spacing: -0.02em; color: var(--ink); }
  .lib-reader-body { margin-top: 24px; font-family: var(--serif); font-size: 18px; line-height: 1.62; color: var(--ink-2); white-space: pre-wrap; }
  .lib-reader-footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  .lib-gallery { display: flex; flex-direction: column; gap: 8px; }
  .lib-gallery-row { display: grid; gap: 8px; }
  .lib-gallery-tile { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); cursor: pointer; overflow: hidden; }
  .lib-gallery-tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .lib-lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; }
  .lib-lightbox-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.7); }
  .lib-lightbox-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px 8px; gap: 8px; }
  .lib-lightbox-body img { max-height: 100%; max-width: 100%; object-fit: contain; }
  .lib-lightbox-nav { flex: 0 0 auto; background: none; border: none; color: rgba(255,255,255,0.5); font-size: 28px; padding: 32px 12px; cursor: pointer; }
  .lib-lightbox-nav:hover { color: #fff; }

  .lib-annot { padding-left: 14px; border-left: 2px solid var(--line); margin-bottom: 18px; }
  .lib-annot.accent { border-left-color: var(--accent); }
  .lib-annot-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
  .lib-annot.accent .lib-annot-meta { color: var(--accent); }
  .lib-annot-body { margin: 5px 0 0; font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; }

  /* ── Forms ───────────────────────────────────────────────────────────── */

  label {
    display: block;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 8px;
  }

  input, textarea, select {
    width: 100%; background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px; padding: 11px 12px;
    /* 16px minimum stops Android/iOS zooming the page on focus. */
    font: 400 16px/1.5 var(--sans); outline: none;
    transition: border-color 0.12s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; }
  select { appearance: none; min-height: 46px; }

  .field { margin-top: 16px; }
  .field:first-child { margin-top: 0; }

  label.check {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--sans); font-size: 15px; font-weight: 400;
    letter-spacing: 0; text-transform: none; color: var(--ink);
    margin: 0; min-height: 44px;
  }
  label.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: 0 0 auto; }

  /* ── Chips ───────────────────────────────────────────────────────────── */
  .chips {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
    margin: 0 -2px; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; min-height: 40px; padding: 0 12px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--ink-2); cursor: pointer;
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .chip[aria-pressed="true"] {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }

  /* ── Buttons ─────────────────────────────────────────────────────────── */
  button.primary {
    width: 100%; min-height: 48px; margin-bottom: 10px;
    border: 1px solid var(--accent); border-radius: 5px;
    background: var(--accent); color: #fff;
    font-family: var(--sans); font-size: 15px; font-weight: 500; cursor: pointer;
  }
  button.primary:disabled { opacity: .5; }

  button.ghost {
    width: 100%; min-height: 44px; border-radius: 5px; cursor: pointer;
    background: transparent; color: var(--ink-2); border: 1px solid var(--line-strong);
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px;
  }
  button.ghost.danger { color: var(--accent); border-color: var(--accent-line); }
  button.ghost.small {
    width: auto; min-height: 32px; padding: 0 10px; margin: 0; font-size: 10px;
  }

  .icon-btn {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 5px;
    background: transparent; border: 1px solid var(--line-strong);
    color: var(--ink-2); cursor: pointer;
    display: grid; place-items: center; font-size: 18px; line-height: 1;
    font-family: var(--sans);
  }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .actions > * { flex: 0 0 auto; }

  .controls { padding: 0 20px 4px; display: grid; gap: 10px; }
  .hint {
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
    color: var(--ink-3); padding: 14px 20px;
  }
  .panel .hint, .field .hint { padding: 8px 0 0; }
  .hidden { display: none !important; }

  /* ── Capture FAB ─────────────────────────────────────────────────────── */
  /* Capture is an action available everywhere, not a destination — so it
     floats above the bar rather than spending one of the five tab slots. */
  .fab {
    position: fixed; right: 16px;
    bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
    z-index: 30; width: 52px; height: 52px; border-radius: 999px;
    background: var(--accent); color: #fff; border: none; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
  }

  /* The rail is the desktop shell only; the media query turns it on. */
  .rail { display: none; }

  .form-actions { padding: 0 20px; }
  .controls.more-row { padding-top: 16px; }

  /* ── Bottom bar ──────────────────────────────────────────────────────── */
  nav.bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; background: var(--surface);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; min-height: var(--nav-h); border: none; background: none;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px;
    color: var(--ink-3); cursor: pointer;
    font-family: var(--sans); font-size: 11px; font-weight: 500; line-height: 1;
    transition: color 0.12s;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-current="true"] { color: var(--ink); font-weight: 600; }

  /* ── More sheet ──────────────────────────────────────────────────────── */
  .sheet-scrim {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.45);
    opacity: 0; transition: opacity 0.18s;
  }
  .sheet-scrim.show { opacity: 1; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
    background: var(--surface);
    border-top: 1px solid var(--line);
    border-radius: 12px 12px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
    max-height: 82vh; overflow-y: auto;
    transform: translateY(100%); transition: transform 0.22s ease;
  }
  .sheet.show { transform: none; }
  .sheet-grip {
    width: 36px; height: 4px; border-radius: 999px;
    background: var(--line-strong); margin: 10px auto 2px;
  }
  .sheet-head { padding: 6px 20px 10px; border-bottom: 1px solid var(--line); }
  .sheet-foot {
    padding: 12px 20px; border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .sheet-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 13px 20px; border: none; background: none;
    color: var(--ink); font: 400 15px var(--sans); text-align: left; cursor: pointer;
  }
  .sheet-item:active { background: var(--active-wash); }
  .sheet-item .glyph {
    width: 22px; flex: 0 0 auto; display: grid; place-items: center;
    color: var(--ink-3); font-size: 15px;
  }

  /* ── Toast ───────────────────────────────────────────────────────────── */
  .toast {
    position: fixed; left: 16px; right: 16px;
    bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
    z-index: 60; padding: 12px 14px; border-radius: 5px;
    background: var(--surface-3); border: 1px solid var(--line-strong);
    color: var(--ink);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .18s, transform .18s;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.ok { border-color: var(--good-line); color: var(--good); }
  .toast.err { border-color: var(--accent-line); color: var(--accent); }

  /* ── Sign in ─────────────────────────────────────────────────────────── */
  #auth { padding: 12vh 20px 0; }
  #auth .brand {
    font-family: var(--serif); font-size: 34px; font-weight: 500;
    letter-spacing: -0.02em; line-height: 1.05; margin: 0 0 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .toast, .sheet, .sheet-scrim, .item { transition: none; }
  }

  /* ═══════════════════════════════════════════════════════════════════════
     Desktop shell — 800px and up.
     The same gate the dashboard uses: below it, a bottom tab bar; above it,
     an icon rail down the left and a capped content column. One codebase,
     two shapes, same URL — the pattern Roseberry Planner already uses.
     ═══════════════════════════════════════════════════════════════════════ */
  @media (min-width: 800px) {
    :root { --rail: 64px; --rail-open: 236px; --rail-slot: var(--rail); }

    body { padding: 0 0 0 var(--rail-slot); }

    /* ── Topbar ──────────────────────────────────────────────────────── */
    .topbar {
      display: flex; align-items: center; gap: 18px;
      height: 60px; flex: 0 0 auto; padding: 0 26px;
      position: sticky; top: 0; z-index: 30;
      border-bottom: 1px solid var(--line); background: var(--bg);
    }
    .topbar-crumb {
      display: flex; align-items: baseline; gap: 9px;
      font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--ink); white-space: nowrap;
    }
    .topbar-crumb .dim { color: var(--ink-3); }
    .topbar-search {
      margin-left: auto; display: flex; align-items: center; gap: 9px;
      width: 300px; height: 34px; padding: 0 11px; border-radius: 5px;
      border: 1px solid var(--line-strong); background: var(--surface);
      color: var(--ink-3); cursor: pointer;
      font-family: var(--sans); font-size: 13px;
    }
    .topbar-search:hover { border-color: var(--ink-3); color: var(--ink-2); }
    .topbar-kbd {
      font-family: var(--mono); font-size: 10px; line-height: 1; color: var(--ink-3);
      border: 1px solid var(--line); border-radius: 3px; padding: 3px 4px; background: var(--bg);
    }
    .topbar-capture {
      display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px;
      border-radius: 5px; border: 1px solid var(--line-strong); background: none;
      color: var(--ink-2); cursor: pointer;
      font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em;
    }
    .topbar-capture:hover { border-color: var(--ink-3); color: var(--ink); }
    .topbar.hidden { display: none; }

    /* The phone's bottom bar and floating button belong to the narrow shell. */
    nav.bar, .fab { display: none !important; }

    /* ── Rail ──────────────────────────────────────────────────────────── */
    .rail {
      position: fixed; inset-block: 0; left: 0; z-index: 40;
      width: var(--rail);
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--surface); border-right: 1px solid var(--line);
      transition: width 0.2s ease-out;
    }
    /* Expands on hover to reveal labels, then collapses again — the content
       column keeps the collapsed width, so nothing reflows underneath.
       Pinning (the footer's pin button, or `[`) widens the SLOT itself
       (--rail-slot, set on body's padding-left) so the rail pushes layout
       instead of overlaying it, and stays open without a hover. */
    .rail:hover, .rail:focus-within, .rail.pinned { width: var(--rail-open); }

    .rail-head {
      display: flex; align-items: center; gap: 12px;
      height: 60px; padding: 0 19px; flex: 0 0 auto;
      border-bottom: 1px solid var(--line);
    }
    .rail-mark {
      flex: 0 0 auto; width: 26px; height: 26px; border-radius: 5px;
      display: grid; place-items: center;
      border: 1px solid var(--line-strong); background: var(--bg);
      color: var(--accent); font-family: var(--serif); font-size: 18px; line-height: 1;
    }
    .rail-name { white-space: nowrap; }
    .rail-name b {
      display: block; font-family: var(--serif); font-weight: 500;
      font-size: 15px; line-height: 1.1; letter-spacing: -0.01em; color: var(--ink);
    }
    .rail-name span {
      display: block; font-family: var(--mono); font-size: 9px; line-height: 1.4;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3);
    }

    .rail-items { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 0; }
    .rail-foot { flex: 0 0 auto; border-top: 1px solid var(--line); padding: 8px 0; }

    .rail-item {
      position: relative; display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 9px 21px; border: none; background: none;
      color: var(--ink-2); cursor: pointer;
      font-family: var(--sans); font-size: 13.5px; text-align: left;
      white-space: nowrap; transition: color 0.12s, background 0.12s;
    }
    .rail-item:hover { background: var(--hover-wash); color: var(--ink); }
    .rail-item .glyph {
      flex: 0 0 22px; display: grid; place-items: center; color: inherit;
    }
    /* Labels fade in with the rail rather than appearing mid-slide. */
    .rail-item .label { opacity: 0; transition: opacity 0.1s; }
    .rail:hover .rail-item .label, .rail:focus-within .rail-item .label,
    .rail.pinned .rail-item .label { opacity: 1; }

    .rail-item[aria-current="true"] { color: var(--ink); font-weight: 600; }
    .rail-item[aria-current="true"]::before {
      content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
      width: 2px; background: var(--accent);
    }
    .rail-item.cta { color: var(--accent); }

    /* Collapsed: a dot on the icon keeps the unread signal visible. Expanded:
       a numeric badge takes over and the dot hides. */
    .rail-dot {
      position: absolute; top: -1px; right: -1px; width: 7px; height: 7px;
      border-radius: 999px; background: var(--ink); border: 1px solid var(--surface);
    }
    .rail-dot.accent { background: var(--accent); }
    .rail-item .glyph { position: relative; }
    .rail:hover .rail-dot, .rail:focus-within .rail-dot, .rail.pinned .rail-dot { opacity: 0; }
    .rail-badge {
      margin-left: auto; font-family: var(--mono); font-size: 10px; line-height: 1;
      padding: 3px 6px; border-radius: 999px; background: var(--ink); color: var(--bg);
      opacity: 0; transition: opacity 0.1s;
    }
    .rail-badge.accent { background: var(--accent); }
    .rail:hover .rail-badge, .rail:focus-within .rail-badge, .rail.pinned .rail-badge { opacity: 1; }

    .rail-account {
      margin-top: 4px; padding: 8px 21px 2px; border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      opacity: 0; transition: opacity 0.1s;
    }
    .rail-account .eyebrow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rail:hover .rail-account, .rail:focus-within .rail-account, .rail.pinned .rail-account { opacity: 1; }

    .rail-sep { height: 1px; margin: 8px 21px; background: var(--line); }

    /* ── Content column ────────────────────────────────────────────────── */
    /* Capped and centred so text lines stay readable on a wide monitor. */
    main {
      max-width: 1120px; margin: 0 auto; width: 100%;
      padding: 0 40px 48px;
    }

    /* Components carry a 20px gutter for the phone; the column owns spacing
       here, so that gutter is removed rather than doubled. */
    .screen-head, .section-label, .controls, .hint, .form-actions, .lib-reader { padding-inline: 0; }
    .item { padding-inline: 0; }
    .panel { margin-inline: 0; }

    .screen-head { padding-top: 40px; padding-bottom: 24px; }
    .screen-head h1 { font-size: 40px; }
    .screen-head .row-actions { align-items: flex-end; }
    /* Meta sits inline to the right of the title once there's room for it. */
    .screen-head .meta { margin-top: 0; }

    /* Forms and buttons don't need to be 1120px wide to be usable. */
    .panel { max-width: 720px; }
    .form-actions { max-width: 360px; }
    .controls { max-width: 720px; }

    /* Search and filters sit side by side instead of stacking. */
    .controls { grid-auto-flow: column; grid-auto-columns: max-content;
                justify-content: start; align-items: center; gap: 16px; }
    .controls input[type="search"] { width: 280px; }

    .toast { left: auto; right: 24px; bottom: 24px; max-width: 380px; }

    .anchor { padding-inline: 0; font-size: 19px; max-width: 720px; }
    .brief-line { padding-inline: 0; }
    .brief-metric { flex-basis: 92px; }
    .brief-metric .big { font-size: 42px; }

    /* The More sheet is a phone affordance; the rail lists everything. */
    .sheet, .sheet-scrim { display: none !important; }
  }
</style>
</head>
<body>

<section id="auth" class="hidden"></section>

<header id="topbar" class="topbar hidden"></header>
<main id="main" class="hidden"></main>

<button id="fab" class="fab hidden" type="button" aria-label="Capture">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<aside id="rail" class="rail hidden" aria-label="Primary"></aside>

<nav id="nav" class="bar hidden" aria-label="Primary"></nav>

<div id="sheetScrim" class="sheet-scrim hidden"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="More"></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
